[project]
name = "visit-note-eval"
version = "0.1.0"
description = "Small eval harness for structured visit-note extraction from (synthetic) clinical transcripts."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ruben Romero Alvarez" }]
dependencies = ["jsonschema>=4.18", "openai>=1.40", "anthropic>=0.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
